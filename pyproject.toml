[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "heuristic-research-agent-skill"
version = "0.6.1"
description = "Auditable evaluation and controlled evolution for research agents across mathematics, quantitative research, machine learning, and deep learning."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "westwhile" }]
dependencies = []

[project.scripts]
research-evolution = "research_evolution.cli:main"

[project.optional-dependencies]
validation = ["PyYAML==6.0.3"]
quality = ["coverage==7.15.4", "mypy==2.3.1", "ruff==0.16.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/research_evolution"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/core" = "research_evolution/_schemas/core"
"schemas/adapters" = "research_evolution/_schemas/adapters"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/research_evolution/evaluation/reports.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_incremental = true
show_error_codes = true
warn_unused_configs = true
