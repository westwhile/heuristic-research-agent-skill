[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "heuristic-research-agent-skill"
version = "0.0.0"
description = "Auditable evaluation and controlled evolution for research agents across mathematics, quantitative research, machine learning, and deep learning."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "All rights reserved until a LICENSE file is selected." }
authors = [{ name = "westwhile" }]
dependencies = []

[project.optional-dependencies]
validation = ["PyYAML==6.0.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/research_evolution"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
